<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Employee</title>

    <style>
        body
        {
            font-family: "Poppins", sans-serif;
            background: #f0f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in-out;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }

        label {
            font-size: 14px;
            color: #444;
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff4e4e;
            box-shadow: 0 0 6px rgba(255,78,78,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff4e4e;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            background: #e63a3a;
        }

        #msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Delete Employee</h2>

    <label>Enter Employee ID:</label>
    <input type="number" id="id" placeholder="Enter Employee ID">

    <button onclick="deleteEmployee()">Delete</button>
    <button style="margin-top:10px; background:#777;" onclick="goBack()">â¬… Back</button>

    <p id="msg"></p>
</div>

<script>
    function deleteEmployee() {
        const id = document.getElementById("id").value;
        const msg = document.getElementById("msg");

        if(!id) {
            msg.style.color = "red";
            msg.innerText = "Please enter an Employee ID!";
            return;
        }

        fetch(`http://localhost:8083/api/delete/${id}`, {
            method: "DELETE"
        })
        .then(r => r.text())
        .then(d => {
            msg.style.color = "green";
            msg.innerText = d;
            document.getElementById("id").value = "";
        })
        .catch(err => {
            msg.style.color = "red";
            msg.innerText = "Failed to delete!";
            console.error(err);
        });
    }

    function goBack() {
      window.location.href = "index.html"; // à¤®à¥à¤–à¥à¤¯ menu page à¤šà¤¾ path à¤¦à¥à¤¯à¤¾
  }

</script>

</body>
</html>
