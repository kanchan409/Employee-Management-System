<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <style>
        body
        {
            font-family: "Poppins", sans-serif;
            background: #f0f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 35px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        label {
            font-size: 14px;
            color: #444;
            margin-bottom: 5px;
            display: block;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4a67ff;
            box-shadow: 0 0 5px rgba(74,103,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #4a67ff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #394fe0;
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Employee</h2>

    <form id="employeeForm">
        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Phone:</label>
        <input type="text" id="phone" required>

        <label>Department:</label>
        <input type="text" id="department" required>

        <label>City:</label>
        <input type="text" id="city" required>

        <label>Salary:</label>
        <input type="number" id="salary" required>

        <button type="submit">Save</button>

    </form>
    <button style="margin-top:10px; background:#777;" onclick="goBack()">â¬… Back</button>

    <p id="msg"></p>
</div>

<script>
    document.getElementById("employeeForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const employee = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            department: document.getElementById("department").value,
            city: document.getElementById("city").value,
            salary: document.getElementById("salary").value
        };

        fetch("http://localhost:8083/api/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(employee)
        })
        .then(response => response.json())
        .then(data => {
            const msg = document.getElementById("msg");
            msg.style.color = "green";
            msg.innerText = "Employee added successfully!";
            document.getElementById("employeeForm").reset();
        })
        .catch(error => {
            const msg = document.getElementById("msg");
            msg.style.color = "red";
            msg.innerText = "Something went wrong!";
            console.error(error);
        });
    });

function goBack() {
    window.location.href = "index.html"; // à¤®à¥à¤–à¥à¤¯ menu page à¤šà¤¾ path à¤¦à¥à¤¯à¤¾
}



</script>

</body>
</html>
